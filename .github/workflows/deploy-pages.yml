# Builds both demos and publishes them to GitHub Pages on every push to main:
#   /<repo>/        → wsop-tv (viewer demo)
#   /<repo>/pitch/  → wsop-tv-pitch (app + CMS demo for internal reporting)
#   /<repo>/v2/     → wsop-tv-v2 (WSOP TV working-title demo)
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            wsop-tv/package-lock.json
            wsop-tv-pitch/package-lock.json
            wsop-tv-v2/package-lock.json
      - name: Build viewer demo (wsop-tv)
        working-directory: wsop-tv
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA fallback: Pages serves 404.html for unknown paths, so deep links still boot the app.
      - run: cp wsop-tv/dist/index.html wsop-tv/dist/404.html
      - name: Build pitch demo (wsop-tv-pitch) into /pitch
        working-directory: wsop-tv-pitch
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pitch/
      - run: cp -r wsop-tv-pitch/dist wsop-tv/dist/pitch
      # Fresh v2 build replaces the copy committed under wsop-tv/public/v2 (that copy serves the Vercel site).
      - name: Build v2 demo (wsop-tv-v2) into /v2
        working-directory: wsop-tv-v2
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/v2/
      - run: rm -rf wsop-tv/dist/v2 && cp -r wsop-tv-v2/dist wsop-tv/dist/v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wsop-tv/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
